services:
  cgroup-candidate:
    image: mdcp-wave0-cgroup-probe:local
    build:
      context: .
      dockerfile_inline: |
        FROM ${MDCP_PYTHON_IMAGE}
        RUN mkdir --mode=0755 /probe /evidence
        COPY tests/feasibility/cgroup_probe.py /probe/cgroup_probe.py
        USER 65534:65534
        ENTRYPOINT ["python", "/probe/cgroup_probe.py"]
    command: ["candidate"]
    profiles: ["cgroup"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    networks: ["probe"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)",
        ]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 2s
    stop_grace_period: 2s

  reset-probe:
    image: mdcp-wave0-cgroup-probe:local
    pull_policy: never
    command: ["reset", "/evidence", "http://cgroup-candidate:8080/allocate"]
    profiles: ["cgroup"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    networks: ["probe"]
    volumes:
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.peak
        target: /evidence/memory.peak
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.current
        target: /evidence/memory.current
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.max
        target: /evidence/memory.max
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/cpu.max
        target: /evidence/cpu.max
        read_only: true
        bind:
          create_host_path: false

  observer:
    image: mdcp-wave0-cgroup-probe:local
    pull_policy: never
    command: ["observe", "/evidence"]
    profiles: ["cgroup"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 32
    network_mode: none
    volumes:
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.peak
        target: /evidence/memory.peak
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.current
        target: /evidence/memory.current
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/memory.max
        target: /evidence/memory.max
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MDCP_CGROUP_PATH:-/sys/fs/cgroup/__unbound__}/cpu.max
        target: /evidence/cpu.max
        read_only: true
        bind:
          create_host_path: false

  load-predictor:
    image: mdcp-wave0-load-probe:local
    build:
      context: .
      dockerfile_inline: |
        FROM ${MDCP_PYTHON_IMAGE}
        RUN python -m pip install --no-cache-dir fastapi==0.116.1 httpx==0.28.1 pydantic==2.11.7 uvicorn==0.35.0
        WORKDIR /app
        COPY src/mdcp /app/src/mdcp
        ENV PYTHONPATH=/app/src \
            PYTHONDONTWRITEBYTECODE=1
        USER 65534:65534
    user: "65534:65534"
    entrypoint: ["python", "-m", "uvicorn", "mdcp.feasibility.synthetic_predictor:app"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    profiles: ["load"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    networks: ["load"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)",
        ]
      interval: 1s
      timeout: 2s
      retries: 20
      start_period: 2s
    stop_grace_period: 2s

  load-generator:
    image: mdcp-wave0-load-probe:local
    pull_policy: never
    profiles: ["load"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "mdcp.feasibility.load_probe"]
    command:
      - --url
      - http://load-predictor:8080/predict
      - --count
      - "2000"
      - --rate
      - "80"
      - --max-in-flight
      - "32"
      - --out
      - /evidence/load-harness.json
    depends_on:
      load-predictor:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: ["load"]
    volumes:
      - type: bind
        source: ${MDCP_LOAD_EVIDENCE_DIR:-/__mdcp_load_evidence_unbound__}
        target: /evidence
        bind:
          create_host_path: false

  postgres-atomic:
    image: ${POSTGRES_IMAGE}
    profiles: ["atomic"]
    user: "999:999"
    environment:
      POSTGRES_DB: mdcp
      POSTGRES_USER: mdcp
      POSTGRES_PASSWORD: wave0-disposable
      PGDATA: /var/lib/postgresql/data/pgdata
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=256m,uid=999,gid=999,mode=0700
      - /run/postgresql:rw,nosuid,size=16m,uid=999,gid=999,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    networks: ["atomic"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdcp -d mdcp"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    stop_grace_period: 3s

  atomic-probe:
    image: mdcp-wave0-atomic-probe:local
    build:
      context: .
      dockerfile_inline: |
        FROM ${MDCP_PYTHON_IMAGE}
        RUN python -m pip install --no-cache-dir cryptography==45.0.6 "psycopg[binary]==3.2.9" pydantic==2.11.7 pytest==8.4.1 rfc8785==0.1.4
        WORKDIR /app
        COPY src/mdcp /app/src/mdcp
        COPY tests/fixtures/crypto /app/tests/fixtures/crypto
        COPY tests/feasibility/test_atomic_transaction.py /app/tests/feasibility/test_atomic_transaction.py
        COPY tests/feasibility/sql /app/tests/feasibility/sql
        ENV PYTHONPATH=/app/src \
            PYTHONDONTWRITEBYTECODE=1
        USER 65534:65534
    profiles: ["atomic"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "mdcp.feasibility.transaction_probe"]
    command:
      - --out
      - /evidence/atomic-transition.json
      - --fixture-root
      - /app/tests/fixtures/crypto
      - --sql
      - /app/tests/feasibility/sql/atomic_transition_probe.sql
    environment:
      MDCP_ATOMIC_DSN: postgresql://mdcp:wave0-disposable@postgres-atomic:5432/mdcp
      MDCP_CRYPTO_FIXTURE_ROOT: /app/tests/fixtures/crypto
      MDCP_ATOMIC_SQL_PATH: /app/tests/feasibility/sql/atomic_transition_probe.sql
    depends_on:
      postgres-atomic:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    networks: ["atomic"]
    volumes:
      - type: bind
        source: ${MDCP_ATOMIC_EVIDENCE_DIR:-/__mdcp_atomic_evidence_unbound__}
        target: /evidence
        bind:
          create_host_path: false

  postgres:
    image: ${POSTGRES_IMAGE}
    profiles: ["stack"]
    user: "999:999"
    environment:
      POSTGRES_DB: mdcp
      POSTGRES_USER: mdcp
      POSTGRES_PASSWORD: wave0-disposable
      PGDATA: /var/lib/postgresql/data/pgdata
    read_only: true
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,size=256m,uid=999,gid=999,mode=0700
      - /run/postgresql:rw,nosuid,size=16m,uid=999,gid=999,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    networks: ["stack"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdcp -d mdcp"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  mlflow:
    image: ${MLFLOW_IMAGE}
    profiles: ["stack"]
    user: "65534:65534"
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////tmp/mlflow.db
      - --default-artifact-root
      - /tmp/artifacts
    environment:
      HOME: /tmp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    networks: ["stack"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 5s

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    profiles: ["stack"]
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    read_only: true
    tmpfs:
      - /prometheus:rw,noexec,nosuid,size=128m,uid=65534,gid=65534,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    networks: ["stack"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  grafana:
    image: ${GRAFANA_IMAGE}
    profiles: ["stack"]
    user: "472:472"
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: reviewer
      GF_SECURITY_ADMIN_PASSWORD: wave0-disposable
    read_only: true
    tmpfs:
      - /var/lib/grafana:rw,noexec,nosuid,size=128m,uid=472,gid=472,mode=0755
      - /var/log/grafana:rw,noexec,nosuid,size=32m,uid=472,gid=472,mode=0755
      - /tmp:rw,noexec,nosuid,size=16m,uid=472,gid=472,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    networks: ["stack"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 5s

  control-probe:
    image: mdcp-wave0-stack-probe:local
    build:
      context: .
      dockerfile_inline: |
        FROM ${MDCP_PYTHON_IMAGE}
        RUN python -m pip install --no-cache-dir fastapi==0.116.1 pydantic==2.11.7 uvicorn==0.35.0
        WORKDIR /app
        COPY src/mdcp /app/src/mdcp
        ENV PYTHONPATH=/app/src \
            PYTHONDONTWRITEBYTECODE=1
        USER 65534:65534
    profiles: ["stack"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "uvicorn", "mdcp.feasibility.synthetic_predictor:app"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    networks: ["stack"]
    healthcheck: &stack-probe-health
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  router-probe:
    image: mdcp-wave0-stack-probe:local
    pull_policy: never
    profiles: ["stack"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "uvicorn", "mdcp.feasibility.synthetic_predictor:app"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    networks: ["stack"]
    healthcheck: *stack-probe-health

  stable:
    image: mdcp-wave0-stack-probe:local
    pull_policy: never
    profiles: ["stack"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "uvicorn", "mdcp.feasibility.synthetic_predictor:app"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    networks: ["stack"]
    healthcheck: *stack-probe-health

  candidate:
    image: mdcp-wave0-stack-probe:local
    pull_policy: never
    profiles: ["stack"]
    user: "65534:65534"
    entrypoint: ["python", "-m", "uvicorn", "mdcp.feasibility.synthetic_predictor:app"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    networks: ["stack"]
    healthcheck: *stack-probe-health

networks:
  probe:
    internal: true
  load:
    internal: true
  atomic:
    internal: true
  stack:
    internal: true
